name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17, 21, 25]
        scala: [2.12.x, 3.x]
        exclude:
          - java: 8
            scala: 3.x

    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: temurin
        cache: sbt

    - uses: sbt/setup-sbt@v1

    - run: sbt "++${{ matrix.scala }}" test scripted publishLocal
